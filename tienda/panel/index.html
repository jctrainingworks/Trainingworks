<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · El Conejito Blanco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--lav:#7B83D6;--lila:#DCD6F7;--noche:#2A1E4D;--crema:#FBF7F1;--suave:#5b5478;--borde:#E8E1F5}
*{box-sizing:border-box;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--crema);color:var(--noche);line-height:1.45;padding-bottom:40px}
h1,h2,h3,.logo{font-family:'Fraunces',Georgia,serif;font-weight:500}
button,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:var(--crema);border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{font-size:18px;font-weight:700}
.ghost{background:none;border:1px solid var(--borde);border-radius:18px;padding:6px 14px;color:var(--noche)}
nav{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--borde);background:#fff;position:sticky;top:53px;z-index:9}
nav button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;color:var(--suave);font-weight:500}
nav button.on{background:var(--noche);color:var(--crema)}
main{max-width:720px;margin:0 auto;padding:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--borde);border-radius:18px;padding:6px 14px;font-size:14px;color:var(--noche)}
.chip.on{background:var(--noche);color:var(--crema);border-color:var(--noche)}
.card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.est{color:#fff;font-size:12px;padding:3px 10px;border-radius:12px}
.mut{color:var(--suave);font-size:13px}
.its{margin:8px 0;font-size:15px}
details{margin:8px 0;font-size:14px}summary{cursor:pointer;color:var(--suave)}
details p{margin-top:6px}
a{color:var(--noche)}
select,input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--noche)}
select{margin-top:6px}
.btn{background:var(--noche);color:var(--crema);border:0;border-radius:12px;padding:13px;font-weight:500;width:100%}
.btn.sec{background:#fff;color:var(--noche);border:1px solid var(--borde)}
.btn.del{background:#fff;color:#b3261e;border:1px solid #f0c9c5}
.prod{display:flex;gap:12px;align-items:center}
.th{width:64px;height:64px;border-radius:10px;flex:none;overflow:hidden;background:var(--lila)}
.th img{width:100%;height:100%;object-fit:cover}
.prod .info{flex:1;min-width:0}.prod b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.low{color:#b3261e;font-weight:500}
.oculto{background:var(--borde);color:var(--suave);font-size:12px;padding:2px 8px;border-radius:10px}
label{display:block;font-size:13px;color:var(--suave);margin:14px 0 4px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--noche);font-size:15px}label.chk input{width:auto}
.sheet{position:fixed;inset:0;background:var(--crema);z-index:20;overflow:auto;padding:16px}
.sheet .in{max-width:520px;margin:0 auto;padding-bottom:40px}
.foto{aspect-ratio:1/1;max-width:240px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:13px;margin-bottom:8px}
.foto img{width:100%;height:100%;object-fit:cover}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gap{display:grid;gap:10px;margin-top:18px}
.ok{background:#e6f4ea;color:#1e6b3a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.err{color:#b3261e;font-size:14px;margin-top:8px}
.login{max-width:360px;margin:12vh auto 0;padding:0 20px;text-align:center}
.login h1{font-size:30px;margin-bottom:4px}.login p{color:var(--suave);margin-bottom:20px}
.login input{margin-bottom:10px}
.empty{text-align:center;color:var(--suave);padding:30px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const U = 'https://wietxwxebyqncslgsdxx.supabase.co';
const K = 'sb_publishable_eOWtUHB4vkqYlX26jVvDBA_5REbkLDl';
const ESTADOS = ['nuevo', 'contactado', 'pagado', 'enviado', 'entregado', 'cancelado'];
const COL = { nuevo: '#E58A3C', contactado: '#7B83D6', pagado: '#3E9B6B', enviado: '#4E8FD6', entregado: '#6b6b7a', cancelado: '#B3261E' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const eur = n => Number(n || 0).toFixed(2).replace('.', ',') + ' €';

let ses = null, tab = 'pedidos', filtro = 'todos', pedidos = [], productos = [], envio = null, edit = null, fotoFile = null, msg = '';
try { ses = JSON.parse(localStorage.getItem('cb_ses') || 'null'); } catch (e) { ses = null; }

function guardarSes(s) { ses = s; try { s ? localStorage.setItem('cb_ses', JSON.stringify(s)) : localStorage.removeItem('cb_ses'); } catch (e) {} }

async function auth(grant, body) {
  const r = await fetch(U + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: K, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || 'No se pudo entrar');
  guardarSes({ access_token: j.access_token, refresh_token: j.refresh_token });
}
async function api(path, opts = {}) {
  const hdr = () => Object.assign({ apikey: K, Authorization: 'Bearer ' + (ses ? ses.access_token : K) }, opts.headers || {});
  let r = await fetch(U + path, Object.assign({}, opts, { headers: hdr() }));
  if (r.status === 401 && ses && ses.refresh_token) {
    try { await auth('refresh_token', { refresh_token: ses.refresh_token }); r = await fetch(U + path, Object.assign({}, opts, { headers: hdr() })); }
    catch (e) { guardarSes(null); render(); throw e; }
  }
  return r;
}

async function cargar() {
  const [a, b, c] = await Promise.all([
    api('/rest/v1/tienda_pedidos?order=creado.desc&limit=200'),
    api('/rest/v1/tienda_productos?order=orden.asc,creado.asc'),
    api('/rest/v1/tienda_ajustes?clave=eq.envio')
  ]);
  pedidos = a.ok ? await a.json() : [];
  productos = b.ok ? await b.json() : [];
  const aj = c.ok ? await c.json() : [];
  envio = aj[0] ? aj[0].valor : { ordinario: { nombre: 'Correo ordinario', precio: 2 }, certificado: { nombre: 'Correo certificado', precio: 4.5 } };
  render();
}

function vistaLogin(err) {
  $('#app').innerHTML = `<div class="login"><h1>El Conejito Blanco</h1><p>Panel de la tienda</p>
    <form id="lf"><input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn">Entrar</button><p class="err">${esc(err || '')}</p></form></div>`;
}

function cardPedido(p) {
  const items = (p.items || []).map(i => `${i.cantidad} × ${esc(i.nombre)}`).join('<br>');
  const f = new Date(p.creado).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const ig = String(p.instagram || '').replace('@', '').trim();
  const est = p.estado || 'nuevo';
  const nom = (envio && envio[p.envio] && envio[p.envio].nombre) || p.envio;
  return `<article class="card"><div class="top"><b>${esc(p.nombre)}</b><span class="est" style="background:${COL[est] || '#999'}">${est}</span></div>
    <div class="mut">${f} · ${eur(p.total)}</div><div class="its">${items}</div><div class="mut">Envío: ${esc(nom)}</div>
    <details><summary>Datos del cliente</summary><p>Instagram: <a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a><br>
    Email: <a href="mailto:${esc(p.email)}">${esc(p.email)}</a><br>Dirección: ${esc(p.direccion)}${p.nota ? '<br>Nota: ' + esc(p.nota) : ''}</p></details>
    <select data-est="${p.id}">${ESTADOS.map(e => `<option ${e === est ? 'selected' : ''}>${e}</option>`).join('')}</select></article>`;
}
function vistaPedidos() {
  const cuenta = e => pedidos.filter(p => (p.estado || 'nuevo') === e).length;
  const chips = ['todos', ...ESTADOS].map(e => `<button class="chip ${e === filtro ? 'on' : ''}" data-f="${e}">${e}${e === 'todos' ? '' : ' (' + cuenta(e) + ')'}</button>`).join('');
  const lista = pedidos.filter(p => filtro === 'todos' || (p.estado || 'nuevo') === filtro);
  return `<div class="chips">${chips}</div>` + (lista.length ? lista.map(cardPedido).join('') : '<p class="empty">No hay pedidos aquí.</p>');
}
function vistaProductos() {
  const l = productos.map(p => `<article class="card prod" data-edit="${esc(p.id)}">
    <div class="th" style="background:${esc(p.color || '#DCD6F7')}">${p.img ? `<img src="${esc(p.img)}" alt="">` : ''}</div>
    <div class="info"><b>${esc(p.nombre)}</b><span class="mut">${eur(p.precio)} · ${esc(p.cat)}</span><br>
    <span class="${p.stock <= 0 ? 'low' : 'mut'}">${p.stock <= 0 ? 'Agotado' : 'Quedan ' + p.stock}</span> ${p.visible ? '' : '<span class="oculto">oculto</span>'}</div></article>`).join('');
  return `<button class="btn" data-new>+ Nuevo producto</button><div style="height:14px"></div>` + (l || '<p class="empty">Aún no hay productos.</p>');
}
function vistaAjustes() {
  const o = envio.ordinario || {}, c = envio.certificado || {};
  return `<div class="card"><h3>Envíos</h3>
    <label>Nombre del envío ordinario</label><input id="a-on" value="${esc(o.nombre)}">
    <label>Precio ordinario (€)</label><input id="a-op" type="number" step="0.01" inputmode="decimal" value="${esc(o.precio)}">
    <label>Nombre del envío certificado</label><input id="a-cn" value="${esc(c.nombre)}">
    <label>Precio certificado (€)</label><input id="a-cp" type="number" step="0.01" inputmode="decimal" value="${esc(c.precio)}">
    <div class="gap"><button class="btn" data-saveaj>Guardar envíos</button></div></div>`;
}
function formProducto() {
  const p = edit.p, cats = [...new Set(productos.map(x => x.cat).filter(Boolean))];
  return `<div class="sheet"><div class="in"><h2>${edit.nuevo ? 'Nuevo producto' : 'Editar producto'}</h2>
    <label>Foto</label><div class="foto" id="prev" style="background:${esc(p.color)}">${p.img ? `<img src="${esc(p.img)}" alt="">` : 'Sin foto'}</div>
    <input type="file" id="ff" accept="image/*">
    <label>Nombre</label><input id="p-nombre" value="${esc(p.nombre)}">
    <label>Categoría</label><input id="p-cat" list="cats" value="${esc(p.cat)}"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="row2"><div><label>Precio (€)</label><input id="p-precio" type="number" step="0.01" inputmode="decimal" value="${esc(p.precio)}"></div>
    <div><label>Unidades</label><input id="p-stock" type="number" inputmode="numeric" value="${esc(p.stock)}"></div></div>
    <label>Descripción</label><textarea id="p-desc" rows="3">${esc(p.descripcion)}</textarea>
    <label>Color de fondo (si no hay foto)</label><input id="p-color" type="color" value="${esc(p.color || '#DCD6F7')}">
    <label class="chk"><input type="checkbox" id="p-vis" ${p.visible ? 'checked' : ''}> Visible en la tienda</label>
    <p class="err" id="p-err"></p>
    <div class="gap"><button class="btn" data-save>Guardar</button><button class="btn sec" data-cancel>Cancelar</button>${edit.nuevo ? '' : '<button class="btn del" data-del>Borrar producto</button>'}</div></div></div>`;
}

function render() {
  if (!ses) return vistaLogin();
  const v = tab === 'pedidos' ? vistaPedidos() : tab === 'productos' ? vistaProductos() : vistaAjustes();
  const nuevos = pedidos.filter(p => (p.estado || 'nuevo') === 'nuevo').length;
  $('#app').innerHTML = `<header><span class="logo">El Conejito Blanco</span><button class="ghost" data-out>Salir</button></header>
    <nav>${[['pedidos', 'Pedidos' + (nuevos ? ' (' + nuevos + ')' : '')], ['productos', 'Productos'], ['ajustes', 'Ajustes']].map(([k, n]) => `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${n}</button>`).join('')}</nav>
    <main>${msg ? `<p class="ok">${esc(msg)}</p>` : ''}${v}</main>${edit ? formProducto() : ''}`;
  msg = '';
}

function reducir(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('No se pudo preparar la foto')); }, 'image/jpeg', 0.8);
    };
    img.onerror = () => rej(new Error('No se pudo leer la foto'));
    img.src = url;
  });
}
async function subirFoto(file) {
  const blob = await reducir(file), name = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = await api('/storage/v1/object/tienda-fotos/' + name, { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: blob });
  if (!r.ok) throw new Error('No se pudo subir la foto');
  return U + '/storage/v1/object/public/tienda-fotos/' + name;
}

async function guardarProducto() {
  const v = id => $(id).value.trim(), err = $('#p-err');
  if (!v('#p-nombre')) { err.textContent = 'Pon un nombre.'; return; }
  const precio = parseFloat(v('#p-precio').replace(',', '.')), stock = parseInt(v('#p-stock'), 10);
  if (isNaN(precio) || precio < 0) { err.textContent = 'Revisa el precio.'; return; }
  if (isNaN(stock) || stock < 0) { err.textContent = 'Revisa las unidades.'; return; }
  const btn = document.querySelector('[data-save]'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    let img = edit.p.img || null;
    if (fotoFile) img = await subirFoto(fotoFile);
    const body = { nombre: v('#p-nombre'), cat: v('#p-cat') || 'Otros', precio, stock, descripcion: v('#p-desc'), color: $('#p-color').value, img, visible: $('#p-vis').checked };
    let r;
    if (edit.nuevo) { body.orden = productos.length + 1; r = await api('/rest/v1/tienda_productos', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(body) }); }
    else r = await api('/rest/v1/tienda_productos?id=eq.' + encodeURIComponent(edit.p.id), { method: 'PATCH', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('No se pudo guardar (' + r.status + ')');
    edit = null; fotoFile = null; msg = 'Producto guardado.'; await cargar();
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Guardar'; }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-edit]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { tab = d.tab; render(); }
  else if (d.f) { filtro = d.f; render(); }
  else if (d.out !== undefined) { guardarSes(null); pedidos = []; productos = []; render(); }
  else if (d.new !== undefined) { edit = { nuevo: true, p: { nombre: '', cat: '', precio: '', stock: 1, descripcion: '', color: '#DCD6F7', img: null, visible: true } }; fotoFile = null; render(); }
  else if (d.edit) { const p = productos.find(x => x.id === d.edit); if (p) { edit = { nuevo: false, p }; fotoFile = null; render(); } }
  else if (d.cancel !== undefined) { edit = null; fotoFile = null; render(); }
  else if (d.save !== undefined) guardarProducto();
  else if (d.del !== undefined) {
    if (!confirm('¿Borrar este producto? No se puede deshacer.')) return;
    const r = await api('/rest/v1/tienda_productos?id=eq.' + encodeURIComponent(edit.p.id), { method: 'DELETE' });
    if (r.ok) { edit = null; msg = 'Producto borrado.'; await cargar(); } else $('#p-err').textContent = 'No se pudo borrar.';
  }
  else if (d.saveaj !== undefined) {
    const n = id => parseFloat($(id).value.replace(',', '.'));
    if (isNaN(n('#a-op')) || isNaN(n('#a-cp'))) { alert('Revisa los precios.'); return; }
    const valor = { ordinario: { nombre: $('#a-on').value.trim() || 'Correo ordinario', precio: n('#a-op') }, certificado: { nombre: $('#a-cn').value.trim() || 'Correo certificado', precio: n('#a-cp') } };
    const r = await api('/rest/v1/tienda_ajustes?on_conflict=clave', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ clave: 'envio', valor }) });
    if (r.ok) { envio = valor; msg = 'Envíos guardados.'; render(); } else alert('No se pudo guardar.');
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.est) {
    const r = await api('/rest/v1/tienda_pedidos?id=eq.' + t.dataset.est, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ estado: t.value }) });
    if (!r.ok) alert('No se pudo cambiar el estado.');
    await cargar();
  } else if (t.id === 'ff' && t.files[0]) {
    fotoFile = t.files[0];
    try { const b = await reducir(fotoFile), u = URL.createObjectURL(b); $('#prev').innerHTML = `<img src="${u}" alt="">`; } catch (x) { $('#p-err').textContent = x.message; fotoFile = null; }
  } else if (t.id === 'p-color') { $('#prev').style.background = t.value; }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'lf') return;
  e.preventDefault();
  try { await auth('password', { email: $('#em').value.trim(), password: $('#pw').value }); await cargar(); }
  catch (x) { vistaLogin('Email o contraseña incorrectos.'); }
});

if (ses) cargar().catch(() => { guardarSes(null); render(); }); else render();
</script>
</body>
</html>
