<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition V1 corregido</title><style>body{margin:0;background:#111318;color:#f3f5f7;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}.card{background:#1b1f27;border:1px solid #303744;border-radius:12px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px;color:#aab2bf;font-size:12px}input,button{background:#11151b;color:#fff;border:1px solid #384252;border-radius:7px;padding:8px}button{cursor:pointer;background:#30265b}.recipe{border:1px solid #303744;border-radius:9px;padding:11px;margin:9px 0}.ingredient{padding:5px 0;border-bottom:1px solid #303744}.ok{color:#35d07f}.bad{color:#ff6575}.small{color:#aab2bf;font-size:12px}.hidden{display:none}.tests{white-space:pre-wrap;font:12px monospace}</style></head><body><main><h1>Nutrition V1 · Motor corregido</h1><p class="small">Motor basado en recetas aprobadas. No mezcla alimentos aleatoriamente.</p><div class="row"><button id="tabTrainer">Panel entrenador</button><button id="tabClient">Vista cliente</button><button id="tabTests">Pruebas</button></div><section id="trainer"><div class="grid"><div class="card"><h2>Objetivo diario</h2><div class="row"><label>HC<input id="dailyC" type="number" value="300"></label><label>Proteína<input id="dailyP" type="number" value="144"></label><label>Grasas<input id="dailyF" type="number" value="58"></label><label>Tolerancia<input id="tol" type="number" value="5"></label></div><p id="dailySummary"></p></div><div class="card"><h2>Objetivos por comida</h2><div id="mealTargets"></div><button id="resetTargets">Restaurar</button></div></div><div class="card"><button id="generate">Calcular y generar alternativas</button><button id="newOptions">Generar de nuevo</button><div id="results"></div></div><div class="card"><h2>Alimentos cargados</h2><div id="foodTable"></div></div></section><section id="client" class="hidden"><div class="card"><h2>Vista cliente</h2><p class="small">Sin macros ni datos técnicos.</p><div id="clientPlan"></div></div></section><section id="tests" class="hidden"><div class="card"><h2>Pruebas</h2><div id="testOutput" class="tests"></div></div></section></main><script>
'use strict';
const foodCatalog={avena:{name:'Avena',c:60,p:13,f:7,k:360},whey:{name:'Whey',c:8,p:75,f:6,k:380},platano:{name:'Plátano',c:23,p:1.1,f:.3,k:95},crema:{name:'Crema cacahuete',c:12,p:25,f:50,k:620},pan:{name:'Pan',c:49,p:9,f:3,k:260},claras:{name:'Claras',c:.7,p:10.5,f:.2,k:50},huevo:{name:'Huevo',c:1.1,p:13,f:10.5,k:143},arroz:{name:'Arroz seco',c:78,p:7,f:.7,k:350},pasta:{name:'Pasta seca',c:70,p:13,f:2,k:350},patata:{name:'Patata',c:17,p:2,f:.1,k:77},pollo:{name:'Pollo',c:0,p:23,f:2,k:110},merluza:{name:'Merluza',c:0,p:18,f:2,k:90},salmon:{name:'Salmón',c:0,p:20,f:13,k:208},pavo:{name:'Pavo',c:2,p:22,f:2,k:115},verduras:{name:'Verduras',c:5,p:2,f:.3,k:30},aove:{name:'AOVE',c:0,p:0,f:100,k:900},yogur:{name:'Yogur proteína',c:4,p:10,f:.2,k:60},cereal:{name:'Cereales',c:80,p:8,f:2,k:370},anacardos:{name:'Anacardos',c:30,p:18,f:44,k:580}};
const mealCatalog={desayuno:{name:'Desayuno',c:70,p:35,f:15},comida:{name:'Comida',c:100,p:40,f:15},preentreno:{name:'Preentreno',c:50,p:20,f:5},cena:{name:'Cena',c:80,p:49,f:23}};
function item(foodId,role,g,min,max,step,auto=true,locked=false){return{foodId,role,g,min,max,step,auto,locked}}
const recipes=[
{id:'d1',meal:'desayuno',name:'Avena con whey, plátano y crema',items:[item('avena','base HC',60,30,100,5),item('whey','proteína',30,20,40,5),item('platano','fruta',120,80,180,5),item('crema','grasa',10,5,20,5)]},
{id:'d2',meal:'desayuno',name:'Pan con huevo, claras y fruta',items:[item('pan','base HC',100,60,150,5),item('huevo','huevo',50,50,100,10),item('claras','proteína',120,80,200,10),item('platano','fruta',100,80,180,5)]},
{id:'c1',meal:'comida',name:'Arroz con pollo, verduras y AOVE',items:[item('arroz','hidrato',100,50,150,5),item('pollo','proteína',150,100,250,10),item('verduras','verdura',150,100,300,25,false),item('aove','grasa',10,5,20,5)]},
{id:'c2',meal:'comida',name:'Patata con merluza, verduras y AOVE',items:[item('patata','hidrato',400,250,600,10),item('merluza','proteína',180,120,250,10),item('verduras','verdura',150,100,300,25,false),item('aove','grasa',10,5,20,5)]},
{id:'p1',meal:'preentreno',name:'Plátano con whey',items:[item('platano','fruta',180,100,250,5),item('whey','proteína',25,20,40,5)]},
{id:'p2',meal:'preentreno',name:'Pan con pavo',items:[item('pan','hidrato',90,50,140,5),item('pavo','proteína',70,50,120,10)]},
{id:'n1',meal:'cena',name:'Arroz con salmón y verduras',items:[item('arroz','hidrato',75,40,120,5),item('salmon','pescado',170,120,240,10),item('verduras','verdura',200,100,350,25,false)]},
{id:'n2',meal:'cena',name:'Patata con merluza, verduras y AOVE',items:[item('patata','hidrato',350,200,550,10),item('merluza','proteína',200,120,280,10),item('verduras','verdura',200,100,350,25,false),item('aove','grasa',12,5,25,5)]}];
const clone=x=>JSON.parse(JSON.stringify(x));const zero=()=>({c:0,p:0,f:0,k:0});function macros(id,g){const x=foodCatalog[id];if(!x)throw Error('foodId inválido: '+id);let q=g/100;return{c:x.c*q,p:x.p*q,f:x.f*q,k:x.k*q}}function sum(a,b){return{c:a.c+b.c,p:a.p+b.p,f:a.f+b.f,k:a.k+b.k}}function total(r){return r.items.reduce((a,i)=>sum(a,macros(i.foodId,i.g)),zero())}function diff(x,t){return{c:x.c-t.c,p:x.p-t.p,f:x.f-t.f}}function valid(x,t,tol){return Math.abs(x.c-t.c)<=tol&&Math.abs(x.p-t.p)<=tol&&Math.abs(x.f-t.f)<=tol}function score(d){return Math.abs(d.c)+Math.abs(d.p)+Math.abs(d.f)}function adjust(base,t,tol){let r=clone(base),best=clone(r),bestScore=Infinity;for(let n=0;n<300;n++){let x=total(r),d=diff(x,t);if(score(d)<bestScore){best=clone(r);bestScore=score(d)}if(valid(x,t,tol))return{r,x,ok:true};let candidates=r.items.filter(i=>i.auto&&!i.locked&&i.step>0);if(!candidates.length)break;let i=candidates.sort((a,b)=>score(diff(total({items:[b]}),{c:0,p:0,f:0}))-score(diff(total({items:[a]}),{c:0,p:0,f:0})))[0];let axis=['c','p','f'].sort((a,b)=>Math.abs(d[b])-Math.abs(d[a]))[0];let per=macros(i.foodId,100)[axis];if(!per){i.auto=false;continue}let change=Math.sign(-d[axis])*i.step;let next=Math.max(i.min,Math.min(i.max,i.g+change));if(next===i.g)i.auto=false;else i.g=next}let x=total(best);return{r:best,x,ok:valid(x,t,tol)}}
function getTargets(){let x={};document.querySelectorAll('[data-meal]').forEach(e=>(x[e.dataset.meal]??={})[e.dataset.m]=+e.value);return x}function renderTargets(){document.getElementById('mealTargets').innerHTML=Object.entries(mealCatalog).map(([id,m])=>`<div class="row"><label>${m.name} HC<input data-meal="${id}" data-m="c" value="${m.c}"></label><label>P<input data-meal="${id}" data-m="p" value="${m.p}"></label><label>G<input data-meal="${id}" data-m="f" value="${m.f}"></label></div>`).join('')}function updateSummary(){let c=+document.getElementById('dailyC').value,p=+document.getElementById('dailyP').value,f=+document.getElementById('dailyF').value;document.getElementById('dailySummary').innerHTML=`Objetivo: <b>${c} HC · ${p} P · ${f} G</b> · ${Math.round(c*4+p*4+f*9)} kcal`}
let approved=[];function renderResults(){let targets=getTargets(),tol=+document.getElementById('tol').value,html='',out=[];approved=[];for(const meal of Object.keys(mealCatalog)){html+=`<h3>${mealCatalog[meal].name} · ${targets[meal].c}/${targets[meal].p}/${targets[meal].f}</h3>`;for(const base of recipes.filter(r=>r.meal===meal)){let z=adjust(base,targets[meal],tol);if(z.ok)approved.push(z.r);let d=diff(z.x,targets[meal]);html+=`<div class="recipe"><b>${base.name}</b> <span class="${z.ok?'ok':'bad'}">${z.ok?'VÁLIDA':'NO VÁLIDA'}</span><div class="small">Total ${z.x.c.toFixed(1)} HC · ${z.x.p.toFixed(1)} P · ${z.x.f.toFixed(1)} G · ${z.x.k.toFixed(0)} kcal<br>Diferencia ${d.c.toFixed(1)} / ${d.p.toFixed(1)} / ${d.f.toFixed(1)}</div>${z.r.items.map(i=>`<div class="ingredient">${foodCatalog[i.foodId].name} (${i.role}): <b>${i.g} g</b> <span class="small">[${i.min}-${i.max}]</span></div>`).join('')}</div>`}}document.getElementById('results').innerHTML=html;renderClient()}function renderClient(){document.getElementById('clientPlan').innerHTML=approved.length?approved.map(r=>`<div class="recipe"><b>${mealCatalog[r.meal].name}: ${r.name}</b><ul>${r.items.map(i=>`<li>${foodCatalog[i.foodId].name}: ${i.g} g</li>`).join('')}</ul></div>`).join(''):'<p>No hay alternativas válidas todavía.</p>'}function renderFoods(){document.getElementById('foodTable').innerHTML='<table>'+Object.entries(foodCatalog).map(([id,x])=>`<tr><td>${x.name}</td><td>${x.c} HC</td><td>${x.p} P</td><td>${x.f} G</td><td>${x.k} kcal</td></tr>`).join('')+'</table>'}function tests(){let a=[];const ok=(x,s)=>a.push((x?'✅ ':'❌ ')+s);recipes.forEach(r=>{ok(r.items.every(i=>foodCatalog[i.foodId]),r.id+' foodId válidos');let x=total(r),y=r.items.map(i=>macros(i.foodId,i.g)).reduce(sum,zero());ok(JSON.stringify(x)===JSON.stringify(y),r.id+' suma correcta');ok(r.items.every(i=>i.g>=i.min&&i.g<=i.max),r.id+' límites correctos')});let z=adjust(recipes[0],mealCatalog.desayuno,5);ok(!z.ok||valid(z.x,mealCatalog.desayuno,5),'válida dentro de tolerancia');document.getElementById('testOutput').textContent=a.join('\n')}function show(id){['trainer','client','tests'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
document.getElementById('generate').onclick=renderResults;document.getElementById('newOptions').onclick=renderResults;document.getElementById('tabTrainer').onclick=()=>show('trainer');document.getElementById('tabClient').onclick=()=>show('client');document.getElementById('tabTests').onclick=()=>show('tests');document.getElementById('resetTargets').onclick=()=>{renderTargets();renderResults()};['dailyC','dailyP','dailyF'].forEach(id=>document.getElementById(id).oninput=updateSummary);renderTargets();renderFoods();updateSummary();tests();renderResults();
</script></body></html>
